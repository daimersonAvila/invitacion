<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Confirma tu Asistencia - Mis XV Años</title>
  <link
          href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@400;700&family=Lato:wght@300;400&display=swap"
          rel="stylesheet"
  />
  <link rel="stylesheet" href="../../assets/base.css" />
  <link rel="stylesheet" href="../../assets/nav.css" />
  <link rel="stylesheet" href="confirmacion.css" />
</head>
<body>
<div id="pageFlip">
  <section class="section bg-dark-red rsvp-section">

    <!-- Flores superiores -->
    <img src="../../assets/img/flores1.png" alt="Flores" class="flowers-top" />

    <!-- Corona arriba al centro -->
    <div class="crown-display">
      <img src="../../assets/img/corona.png" alt="Corona" />
    </div>

    <!-- Mariposas decorativas -->
    <img src="../../assets/img/mar1.png" class="bfly bfly-1" alt="Mariposa" />
    <img src="../../assets/img/mar1.png" class="bfly bfly-2" alt="Mariposa" />

    <!-- Subtítulo -->
    <h3 class="section-subtitle">Confirma tu Asistencia</h3>

    <!-- Línea decorativa -->
    <div class="divider">
      <span class="divider-line"></span>
      <span class="divider-icon">✦</span>
      <span class="divider-line"></span>
    </div>

    <!-- Texto -->
    <p class="rsvp-text">
      Tu presencia es mi mejor regalo. Por favor confirma antes del <strong>20 de Noviembre</strong>.
    </p>

    <!-- Formulario -->
    <form id="rsvpForm" class="rsvp-form">

      <div class="form-group">
        <label for="nombre">Nombre completo</label>
        <input
                type="text"
                id="nombre"
                placeholder="Escribe tu nombre"
                required
        />
      </div>

      <div class="form-group">
        <label for="asistencia">¿Nos acompañarás?</label>
        <select id="asistencia" required>
          <option value="">Selecciona una opción</option>
          <option value="Sí, asistiré">Sí, asistiré ✦</option>
          <option value="No podré asistir">No podré asistir</option>
        </select>
      </div>

      <div class="form-group">
        <label for="personas">Número de personas</label>
        <input
                type="number"
                id="personas"
                placeholder="1"
                min="1"
                max="10"
                value="1"
        />
      </div>

      <button type="submit" class="btn-enviar">
        <span>Enviar Confirmación</span>
        <span class="btn-icon">✦</span>
      </button>
    </form>

  </section>
</div>

<script src="../../assets/animations.js"></script>
<script src="../../assets/nav.js"></script>
<script src="confirmacion.js"></script>
</body>
</html>
